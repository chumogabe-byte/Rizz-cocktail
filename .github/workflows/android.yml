name: Build Android app

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address baked into the app (e.g. https://rizz.example.com). Leave blank to ask on first launch."
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || vars.RIZZ_API_URL }}

      - name: Sync into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../rizz-cocktail-bar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rizz-cocktail-bar-apk
          path: rizz-cocktail-bar.apk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rizz-cocktail-bar.apk
